apiVersion: batch/v1
kind: Job
metadata:
  name: ui-tests
  labels:
    app: playwright-tests
    component: ui-tests
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: playwright-tests
        component: ui-tests
    spec:
      restartPolicy: Never
      containers:
        - name: ui-tests
          image: chandruks83/playwright-juice-shop:1.1
          imagePullPolicy: IfNotPresent
          env:
            - name: BASE_URL
              value: http://juice-shop:3000
            - name: CI
              value: "true"
          command:
            - npx
            - playwright
            - test
            - --project=ui
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
