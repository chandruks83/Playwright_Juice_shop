name: Playwright Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      juice-shop:
        image: bkimminich/juice-shop:v13.2.0
        ports:
          - 3000:3000

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Wait for Juice Shop
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://localhost:3000 > /dev/null; then
              echo "Juice Shop is ready"
              exit 0
            fi

            echo "Waiting for Juice Shop (attempt ${attempt}/30)"
            sleep 2
          done

          echo "Juice Shop did not become ready" >&2
          exit 1

      - name: Register CI test user
        run: |
          node -e "const user = require('./fixtures/new-user.json'); user.passwordRepeat = user.password; user.securityAnswer = 'fish'; process.stdout.write(JSON.stringify(user));" |
            curl --fail-with-body \
              --request POST \
              --header "Content-Type: application/json" \
              --data-binary @- \
              http://localhost:3000/api/Users

      - name: Run Playwright tests
        run: npm test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
